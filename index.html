<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Galang</title>
  <style>
    :root { color-scheme: dark; font-family: "Trebuchet MS", sans-serif; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; background: #020617; color: #f8fafc; }
    nav { align-items: center; display: flex; justify-content: space-between; margin: 0 auto; max-width: 1152px; padding: 24px; }
    nav h1 { color: #60a5fa; font-size: 1.5rem; margin: 0; }
    nav a { color: #cbd5e1; font-size: .95rem; text-decoration: none; }
    nav a:hover { color: #60a5fa; }
    .hero { align-items: center; display: flex; min-height: 78vh; padding: 48px 24px; }
    .hero-inner { margin: 0 auto; max-width: 1152px; width: 100%; }
    .eyebrow { color: #60a5fa; font-size: 1.1rem; }
    h2 { font-size: clamp(3rem, 8vw, 5.5rem); line-height: 1; margin: 16px 0; }
    .intro { color: #cbd5e1; font-size: clamp(1rem, 2vw, 1.25rem); line-height: 1.7; margin: 0; max-width: 600px; }
    .button { background: #3b82f6; border-radius: 8px; color: #fff; display: inline-block; font-weight: 700; margin-top: 32px; padding: 14px 22px; text-decoration: none; }
    .button:hover { background: #2563eb; }
    footer { border-top: 1px solid #334155; color: #94a3b8; padding: 24px; text-align: center; }
    footer p { margin: 0; }
    @media (max-width: 640px) { nav { padding: 20px; } .hero { min-height: 72vh; padding: 32px 20px; } }
  </style>
</head>

<body class="bg-slate-950 text-white">

  <!-- Navbar -->
  <nav>
    <h1>
      Galang.
    </h1>

    <div>
      <a href="index.html">
        Home
      </a>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-inner">

      <p class="eyebrow">
        Hello, I'm
      </p>

      <h2>
        Galang
      </h2>

      <p class="intro">
        Mahasiswa yang tertarik dengan hal-hal yang berkaitan dengan Audio Engineering, Musik, Game Development, Illustration, Animation dan banyak hal lainnya.
      </p>

      <a
        href="#contact"
        class="button"
      >
        Lihat Project
      </a>

    </div>
  </section>

  <!-- Footer -->
  <footer id="contact">
    <p>
      © 2026 Galang. All Rights Reserved.
    </p>
  </footer>

</body>
</html>
